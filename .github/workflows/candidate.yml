name: Candidate bundle
on:
  push:
    branches: [release/reports-first-rc]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r reports/requirements.txt
      - run: python scripts/fetch-report-fonts.py "$RUNNER_TEMP/report-fonts"
      - name: Test source, generate the single candidate dist, verify reports
        env:
          REPORT_FONT_DIR: ${{ runner.temp }}/report-fonts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-evidence/build
          npm test | tee candidate-evidence/build/node-tests.txt
          npm run build | tee candidate-evidence/build/build.txt
          npm run verify | tee candidate-evidence/build/verify.txt
          python scripts/verify-reports.py | tee candidate-evidence/build/reports.txt
          python scripts/check-report-reproduction.py | tee candidate-evidence/build/reproduction.txt
          cp -R output/verification candidate-evidence/build/
          python - <<'PY'
          import hashlib,json,os,platform,subprocess
          from pathlib import Path
          root=Path('candidate-evidence/build')
          hashes={p.relative_to('dist').as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(Path('dist').rglob('*')) if p.is_file()}
          (root/'dist-sha256.json').write_text(json.dumps(hashes,indent=2)+'\n')
          result={'status':'PASS','commit':os.environ['GITHUB_SHA'],'run_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",'python':platform.python_version(),'node':subprocess.check_output(['node','--version'],text=True).strip(),'checks':['npm test','single dist build','verify','source HTML PDF parity','independent control generation','negative source/template stale-output checks'],'clean_environment':'GitHub Actions checkout of exact commit; control generation in separate temporary tree'}
          (root/'build-result.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-build-${{ github.sha }}
          path: candidate-evidence/build/
          if-no-files-found: error
          retention-days: 30
  candidate-browser:
    needs: candidate-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-dist-${{ github.sha }}
          path: dist
      - env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-browser.txt
          python -m playwright install --with-deps "$BROWSER"
      - env:
          BROWSER: ${{ matrix.browser }}
        run: bash scripts/run-browser-checks.sh "$BROWSER" browser-artifacts
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-browser-${{ matrix.browser }}-${{ github.sha }}
          path: browser-artifacts/
          if-no-files-found: error
          retention-days: 30
  candidate-package:
    needs: [candidate-build, candidate-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-dist-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: candidate-build-${{ github.sha }}
          path: candidate-evidence/build
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: candidate-browser-*-${{ github.sha }}
          path: browser-downloads
      - name: Assemble without rebuilding the tested dist
        shell: bash
        run: |
          set -euo pipefail
          for browser in chromium firefox webkit; do
            mv "browser-downloads/candidate-browser-$browser-$GITHUB_SHA" "candidate-evidence/$browser"
          done
          mkdir -p output
          python scripts/package-candidate.py --evidence candidate-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            output/candidate/*.zip
            output/candidate/candidate-manifest.json
            output/candidate/bundle-sha256.txt
          if-no-files-found: error
          retention-days: 30
