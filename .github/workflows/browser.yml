name: Browser regression
on:
  pull_request:
  push:
    branches: [release/reports-first-rc]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    # This exact integration PR is covered by rc3-preview.yml on its push SHA.
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/review-integrated-rc3' && github.base_ref == 'feat/modern-experience') }}
    name: browser (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked toolchain
        run: npm ci
      - name: Check strict TypeScript
        run: npm run typecheck
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Install pinned browser test dependencies
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-browser.txt
          python -m playwright install --with-deps "$BROWSER"
      - name: Build the artifact under test
        run: npm run build && npm run verify
      - name: Test actual HTTP and DOM interactions
        env:
          BROWSER: ${{ matrix.browser }}
        shell: bash
        run: bash scripts/run-browser-checks.sh "$BROWSER" browser-artifacts
      - name: Retain browser results and sanitized failure traces
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: browser-${{ matrix.browser }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: browser-artifacts/
          if-no-files-found: warn
          retention-days: 14
